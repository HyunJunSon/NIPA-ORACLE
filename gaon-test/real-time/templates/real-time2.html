<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>실시간 음성 대화</title>
  </head>
  <body>
    <h3>🎤 실시간 음성 → 텍스트</h3>
    <input id="user" placeholder="이름 입력" />
    <button id="startBtn">🎙️ 대화 시작</button>
    <button id="stopBtn">⏹️ 종료</button>
    <div id="textContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
    <script>
      const socket = io.connect(location.origin);
      const user = document.getElementById("user");
      const textContainer = document.getElementById("textContainer");
      let mediaRecorder;
      let audioChunks = [];

      socket.on("text_result", (data) => {
        const div = document.createElement("div");
        div.textContent = `${data.user}: ${data.text}`;
        textContainer.appendChild(div);
      });

      document.getElementById("startBtn").onclick = async () => {
        // Try to get audio with specific constraints for better quality
        const constraints = {
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: 44100
          },
        };
        
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        
        // Try to use audio/webm as it's more commonly supported by browsers
        const options = { mimeType: 'audio/webm' };
        try {
          mediaRecorder = new MediaRecorder(stream, options);
        } catch (e) {
          console.warn('Could not create MediaRecorder with audio/webm, trying default:', e);
          mediaRecorder = new MediaRecorder(stream); // fallback to default
        }
        mediaRecorder.start();

        mediaRecorder.ondataavailable = (e) => {
          audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          // Send the audio data in the format it was captured (webm)
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          audioChunks = [];
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => {
            const base64Audio = reader.result.split(",")[1];
            socket.emit("audio_stream", {
              user: user.value || "익명",
              audio: base64Audio,
            });
          };
        };
      };

      document.getElementById("stopBtn").onclick = () => {
        if (mediaRecorder) mediaRecorder.stop();
      };
    </script>
  </body>
</html>
