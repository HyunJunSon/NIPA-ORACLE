<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .float-left {
      float: right;
      background: lightcoral;
    }
    .float-none {
      float: none; /*float-효과제거 */
      background: lightgreen;
    }
    .box {
      width: 100px;
      height: 100px;
      margin: 10px;
      border: 1px solid black;
    }
  </style>
  <body>
    <div class="box float-left">float: left</div>
    <div class="box float-none">float: none</div>
    <div class="box">일반 박스</div>
  </body>
</html>
