<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BootStrap 기본구조</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="">This is BootStrap</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-
          target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1 class="text-center text-primary">Hello BootStrap~!</h1>
    </div>

    <div class="row text-center">
      <div class="col-sm-6 col-md-4 col-lg-3 bg-info">Box01</div>
      <div class="col-sm-6 col-md-4 col-lg-3 bg-warning">Box02</div>
      <div class="col-sm-6 col-md-4 col-lg-3 bg-danger">Box03</div>
      <div class="col-sm-6 col-md-4 col-lg-3 bg-success">Box04</div>
    </div>

    <div class="row my-3 text-center">
      <button class="col-lg-4 btn btn-primary">Primary</button>
      <button class="col-lg-4 btn btn-outline-success">Outline</button>
      <button class="col-lg-4 btn btn-danger btn-lg">Large</button>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6 d-flex justify-content-center gap-3">
        <div class="card" style="width: 30em">
          <img
            src="https://picsum.photos/300/200"
            class="card-img-top"
            alt="..."
          />
          <div class="card-body">
            <h5 class="card-title">Card Title</h5>
            <p class="card-text">Bootstrap 카드 예제입니다.</p>
            <a href="#" class="btn btn-primary">Go somewhere</a>
          </div>
        </div>

        <div class="card" style="width: 18rem">
          <img
            src="https://picsum.photos/300/200"
            class="card-img-top"
            alt="..."
          />
          <div class="card-body">
            <h5 class="card-title">Card Title</h5>
            <p class="card-text">Bootstrap 카드 예제입니다.</p>
            <a href="#" class="btn btn-primary">Go somewhere</a>
          </div>
        </div>
      </div>
    </div>
