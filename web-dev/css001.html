<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 선택자</title>
  </head>
  <style>
    h1:hover {
      color: red;
      font-size: 50px;
    }
    #daum:active {
      color: blue;
      font-size: 50px;
    }
    #naver:visited {
      color: green;
      font-size: 50px;
    }
  </style>
  <body>
    <h1>Hello!</h1>
    <a href="http://www.daum.net" id="daum">다음</a><br />
    <a href="http://www.naver.com" id="naver" target="_blank">네이버</a><br />
  </body>
</html>
