<!-- opacity -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opacity 속성</title>
    <style>
      .block {
        background-color: red;
        margin-top: 5px;
        width: 100px;
        height: 100px;
      }
      body :nth-child(1) {
        opacity: 1;
      }
      body :nth-child(2) {
        opacity: 0.5;
      }
      body :nth-child(3) {
        opacity: 0.2;
      }
    </style>
  </head>
  <body>
    <div class="block">Block 영역 1</div>
    <div class="block">Block 영역 2</div>
    <div class="block">Block 영역 3</div>
  </body>
</html>
