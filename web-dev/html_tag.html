<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a 태그 예제</title>
  <style>
    header h2{color: orange}
    a:hover{color: red;}
  </style>
</head>
<body>
    <p><a href="https://www.google.com" target="_blank">구글로 이동</a></p>
    <!-- 동일이미지 내 특정 페이지로 이동 -->
    <p><a href="#section1">섹션1로 이동</a><a href="#section2">섹션2로 이동</a></p>
    <a href="#section3">섹션3로 이동</a></p>
    <header id="section1" style="height:200px; background-color:lightgray;">
      <h2>섹션 1</h2>
      <p>이것은 섹션 1의 내용입니다</p>
    </header>
    <main id="section2" style="height:200px; background-color:lightblue;">
      <h2>섹션 2</h2>
      <p>이것은 섹션 2의 내용입니다</p>
    </ㅡ>
    <!-- 이미지링크 (클릭시 메일 앱 실행) -->
    <article id="section3">
      <h2>section3</h2>
      <img src="images/girl.jpeg" height="300px" width="300px">
    </article>
    <p><a href="images/girl.jpeg">나의이미지</a></p>
    <!-- 파일 다운로드 -->
    <p><a href="images/my.jpeg" download>파일 다운로드</a></p>
    <p><a href="https://www.google.com" target="_blank">구글로 이동</a></p>
</body>
</html>
